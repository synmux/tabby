# Tabby — New Tab Page Dashboard Configuration
# Copy this file to tabby.toml and customise as needed.

[server]
host = "localhost"
port = 8080
# tls = true
# cert_file = "cert.pem"
# key_file = "key.pem"

# Each widget can be enabled/disabled and has its own refresh interval.
# Settings are widget-specific key-value pairs for API keys, URLs, etc.

[widgets.weather]
enabled = true
refresh_interval = "5m"
# settings.latitude = "51.5074"
# settings.longitude = "-0.1278"

[widgets.rss]
enabled = true
refresh_interval = "10m"
# settings.feeds = "https://hnrss.org/frontpage,https://feeds.arstechnica.com/arstechnica/index"

[widgets.uptime]
enabled = true
refresh_interval = "30s"
# settings.targets = "https://example.com,https://api.example.com"

[widgets.github]
enabled = true
refresh_interval = "2m"
# settings.token = ""
# settings.repos = "owner/repo1,owner/repo2"

[widgets.linear]
enabled = true
refresh_interval = "2m"
# settings.api_key = ""
# settings.team = ""

[widgets.notion]
enabled = true
refresh_interval = "3m"
# settings.token = ""

[widgets.omi]
enabled = true
refresh_interval = "5m"
# settings.api_key = ""

[widgets.calendar]
enabled = true
refresh_interval = "1m"
# settings.calendar_url = ""
